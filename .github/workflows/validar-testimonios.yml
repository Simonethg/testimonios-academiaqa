name: Validar testimonios

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Usar Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Un PR de testimonio solo agrega archivos en data/testimonios/
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cambios=$(git diff --name-status --no-renames "origin/${BASE_REF}...HEAD")
          echo "Cambios del PR:"; echo "$cambios"
          if [ -z "$cambios" ]; then echo "::error::El PR no tiene cambios."; exit 1; fi
          fuera=$(echo "$cambios" | grep -vE '^A[[:space:]]+data/testimonios/[a-z0-9-]+/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.json$' || true)
          if [ -n "$fuera" ]; then
            echo "::error::Este PR modifica, borra o agrega archivos fuera de data/testimonios/<curso>/. Para sumar tu mensaje, solo agregá tu archivo nuevo."
            echo "$fuera"
            exit 1
          fi

      - name: Tests de las reglas
        run: npm test

      - name: Validar cada mensaje
        run: npm run validar

      - name: Validar los ejemplos
        run: node scripts/validar-testimonios.mjs data/ejemplos.json

      - name: Generar el índice público (prueba)
        run: npm run generar
