<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Muro de gratitud: mensajes de quienes hicieron los cursos de AcademiaQA.">
  <title>Muro de gratitud · AcademiaQA</title>
  <link rel="preload" href="assets/fonts/kanit-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script src="assets/js/tema-temprano.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body class="muro">
  <div class="fondo" aria-hidden="true"></div>
  <a class="saltar" href="#muro-zona" data-i18n="skip">Saltar al muro</a>

  <header class="cabecera contenedor">
    <p class="marca"><span class="marca__logo" aria-hidden="true"></span><span data-i18n="brand">AcademiaQA</span></p>
    <div class="controles">
      <div class="selector-idioma" role="group" data-i18n-aria="idioma" aria-label="Idioma">
        <button type="button" class="boton-chico" data-idioma="es" lang="es">ES</button>
        <button type="button" class="boton-chico" data-idioma="en" lang="en">EN</button>
      </div>
      <button type="button" class="boton-chico boton-icono" id="boton-tema" aria-pressed="false"><span aria-hidden="true" class="icono-tema"></span><span class="visualmente-oculto" data-i18n="tema_oscuro">Modo oscuro</span></button>
    </div>
  </header>

  <main id="contenido" class="contenedor principal">
    <section class="portada" aria-labelledby="titulo">
      <h1 id="titulo" class="titulo"><span data-i18n="titulo_antes">Muro de </span><span class="resaltado" data-i18n="titulo_resaltado">gratitud</span><span data-i18n="titulo_despues"></span></h1>
      <p class="bajada" data-i18n="bajada"></p>
      <div class="acciones">
        <div class="cursos" role="group" data-i18n-aria="cursos" aria-label="Elegí un curso">
          <span class="cursos__indicador" id="indicador-curso" aria-hidden="true"></span>
          <div id="botones-cursos" class="cursos__botones"></div>
        </div>
        <button type="button" class="boton boton--grande" data-abrir="dialogo-como">
          <svg class="boton__icono" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 6.5l4 4" stroke="currentColor" stroke-width="2"/></svg>
          <span data-i18n="cta_dejar">Dejar mi mensaje</span>
        </button>
      </div>
    </section>

    <section id="muro-zona" class="muro-zona" aria-labelledby="titulo-muro" tabindex="-1">
      <h2 id="titulo-muro" class="conteo"><span id="conteo"></span></h2>
      <div id="muro" class="muro-grilla">
        <ul id="mensajes" class="tarjetas"></ul>
        <div id="vacio" class="vacio" hidden>
          <img class="vacio__ilustracion" src="assets/img/muro-vacio.svg" width="260" height="170" alt="">
          <p class="vacio__titulo" data-i18n="vacio_titulo"></p>
          <p id="vacio-texto" class="vacio__texto"></p>
        </div>
      </div>
      <nav id="paginacion" class="paginacion" data-i18n-aria="paginacion" aria-label="Paginación del muro" hidden>
        <button type="button" class="boton-chico boton-icono" id="pagina-anterior"><span aria-hidden="true">←</span><span class="visualmente-oculto" data-i18n="anterior">Anterior</span></button>
        <p id="pagina-texto" class="paginacion__texto" aria-live="polite"></p>
        <button type="button" class="boton-chico boton-icono" id="pagina-siguiente"><span aria-hidden="true">→</span><span class="visualmente-oculto" data-i18n="siguiente">Siguiente</span></button>
      </nav>
    </section>
  </main>

  <footer class="pie contenedor">
    <a class="pie__qr" href="https://www.simonethg.com">
      <img src="assets/img/qr-simonethg.svg" width="36" height="36" alt="Código QR que lleva a www.simonethg.com" data-i18n-alt="pie_qr_alt">
      <span class="pie__handles"><span>@SimonethG · @academia_qa</span><span class="pie__sitio">www.simonethg.com</span></span>
    </a>
    <p class="pie__links"><button type="button" class="enlace" data-abrir="dialogo-privacidad" data-i18n="privacidad_titulo">Privacidad</button> · <span data-i18n="pie_licencia">Código MIT · Textos CC BY 4.0</span></p>
  </footer>

  <dialog id="dialogo-como" class="dialogo" aria-labelledby="titulo-como">
    <div class="dialogo__cabecera">
      <h2 id="titulo-como" data-i18n="como_titulo">¿Cómo dejo mi mensaje?</h2>
      <button type="button" class="boton-chico" data-cerrar data-i18n="cerrar">Cerrar</button>
    </div>
    <p data-i18n="como_intro"></p>
    <ol class="pasos">
      <li data-i18n="paso_1"></li>
      <li data-i18n="paso_2"></li>
      <li data-i18n="paso_3"></li>
    </ol>
    <form id="formulario" class="formulario" novalidate aria-labelledby="titulo-form">
      <h3 id="titulo-form" data-i18n="form_titulo">Armá tu archivo</h3>
      <p class="ayuda" data-i18n="form_ayuda"></p>
      <div id="form-errores" class="form-errores" role="alert" tabindex="-1" hidden></div>
      <div class="campo-doble">
        <div class="campo">
          <label for="f-curso" data-i18n="form_curso"></label>
          <select id="f-curso" name="curso" required></select>
        </div>
        <div class="campo" id="campo-clase" hidden>
          <label for="f-clase" data-i18n="form_clase"></label>
          <select id="f-clase" name="clase"></select>
        </div>
      </div>
      <div class="campo-doble">
        <div class="campo">
          <label for="f-nombre" data-i18n="form_nombre"></label>
          <input id="f-nombre" name="nombre" type="text" maxlength="40" autocomplete="nickname" required>
        </div>
        <div class="campo">
          <label for="f-rol" data-i18n="form_rol"></label>
          <input id="f-rol" name="rol" type="text" maxlength="40" autocomplete="off">
        </div>
      </div>
      <div class="campo">
        <label for="f-mensaje" data-i18n="form_mensaje"></label>
        <textarea id="f-mensaje" name="mensaje" rows="3" maxlength="280" required aria-describedby="f-contador"></textarea>
        <p id="f-contador" class="contador-caracteres"><span id="f-restantes">280</span> <span data-i18n="form_restantes"></span></p>
      </div>
      <div class="campo campo--check">
        <input id="f-consentimiento" name="consentimiento" type="checkbox" required>
        <label for="f-consentimiento" data-i18n="form_consentimiento"></label>
      </div>
      <button type="submit" class="boton" data-i18n="form_generar">Armar mi archivo</button>

      <div id="resultado" class="resultado" hidden>
        <label for="f-archivo" data-i18n="form_archivo"></label>
        <input id="f-archivo" type="text" readonly spellcheck="false">
        <label for="f-salida" data-i18n="form_resultado"></label>
        <textarea id="f-salida" rows="9" readonly spellcheck="false"></textarea>
        <div class="resultado__acciones">
          <button type="button" class="boton boton--secundario" id="boton-copiar" data-i18n="form_copiar">Copiar</button>
          <a id="enlace-crear" class="boton" href="#" target="_blank" rel="noopener" data-i18n="crear_archivo">Crear mi archivo en GitHub</a>
        </div>
        <p id="estado-copia" class="ayuda" aria-live="polite"></p>
      </div>
    </form>
    <p class="dialogo__pie"><a id="enlace-guia" href="CONTRIBUTING.md" target="_blank" rel="noopener" data-i18n="ver_guia">Guía paso a paso</a></p>
  </dialog>

  <dialog id="dialogo-privacidad" class="dialogo dialogo--chico" aria-labelledby="titulo-privacidad">
    <div class="dialogo__cabecera">
      <h2 id="titulo-privacidad" data-i18n="privacidad_titulo">Privacidad</h2>
      <button type="button" class="boton-chico" data-cerrar data-i18n="cerrar">Cerrar</button>
    </div>
    <p data-i18n="privacidad_texto"></p>
  </dialog>
</body>
</html>
